name = "viveworker-share"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Custom domain: share.viveworker.com
# custom_domain = true tells Cloudflare to manage the DNS record automatically.
routes = [
  { pattern = "share.viveworker.com", zone_name = "viveworker.com", custom_domain = true },
]

# A2A relay's KV — read-only, used to validate X-A2A-User + X-A2A-Key headers.
# This ID matches the `KV` binding in ../worker/wrangler.toml.
[[kv_namespaces]]
binding = "USERS_KV"
id = "edf93b80de6048ed9a68fad679473d57"
preview_id = "06279d9087ea4242a2a3055ea6f57583"

# Share service's own KV — replace the IDs after running:
#   wrangler kv namespace create SHARE_KV
#   wrangler kv namespace create SHARE_KV --preview
[[kv_namespaces]]
binding = "SHARE_KV"
id = "8427125a737a46a4b0875d5b601c5351"
preview_id = "1935eca5482f4f3db8ff50ec67891db9"

# R2 bucket for the HTML bodies — create with:
#   wrangler r2 bucket create viveworker-share-files
[[r2_buckets]]
binding = "SHARE_FILES"
bucket_name = "viveworker-share-files"
preview_bucket_name = "viveworker-share-files-preview"

# SHARE_SECRET (HMAC key for unlock cookies) is a secret, not a var.
# Set it with:
#   wrangler secret put SHARE_SECRET
# (paste a random 32+ byte string, e.g. `openssl rand -hex 32`)

# x402 payment gate config. The worker now delegates requirements / verify
# / settle to hazbase-backend-api and keeps only the share-specific 402 page
# + paid-cookie logic locally. `X402_NETWORK` still pins the default upload
# network for new paid shares; `HAZBASE_API_ENDPOINT` points at the backend.
[vars]
X402_NETWORK = "base-sepolia"
HAZBASE_API_ENDPOINT = "https://api.hazbase.com"

# Closed-beta allowlist for paid shares. A CSV of userIds permitted to attach
# `--price` / `--pay-to` on upload. Everyone else gets 403 paid-shares-closed-beta
# on upload; existing free shares and password-gated shares are unaffected.
# Set it with:
#   echo "alice,bob,carol" | wrangler secret put X402_BETA_ALLOWLIST
# Leave unset to block everyone (recommended while the x402 gate is testnet-only).

# CF_ACCOUNT_ID + CF_API_TOKEN are required for the `share list --metrics`
# endpoint to query Analytics Engine. API token needs the "Account Analytics:
# Read" permission scoped to this account.
#   wrangler secret put CF_ACCOUNT_ID
#   wrangler secret put CF_API_TOKEN

# Analytics Engine dataset for payment-gate observability. Free tier is 10M
# datapoints/day, which is far more headroom than per-upload/view KV writes
# would give us. Queried via the CF REST API.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "viveworker_share_events"
