name = "viveworker-pairing-relay"
main = "worker.js"
compatibility_date = "2024-09-23"
# Production cutover: only the custom domain serves traffic. The historical
# `*.workers.dev` URL would otherwise stay up alongside `pairing.viveworker.com`,
# leaving an unintended parallel endpoint that bypasses the custom-domain CDN
# rules. Flip back to `true` for one-off `wrangler dev` smoke tests if needed.
workers_dev = false

# Custom domain — `custom_domain = true` lets Cloudflare auto-manage the
# DNS record (same pattern as share-worker / a2a-worker). Zone already
# exists in this account.
routes = [
  { pattern = "pairing.viveworker.com", zone_name = "viveworker.com", custom_domain = true },
]

# PairingChannel — one Durable Object instance per pairingId. Holds the two
# WebSockets (phone + bridge) and an in-memory replay buffer. Hibernatable:
# CF unloads the DO between messages so we don't pay for idle pairings.
[[durable_objects.bindings]]
name = "PAIRING_CHANNEL"
class_name = "PairingChannel"

# SQLite-backed DO is the recommended default for new projects. We don't
# persist anything to it in Phase 1 (in-memory replay buffer only) but the
# binding is future-proofed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingChannel"]
