name = "viveworker-pairing-relay"
main = "worker.js"
compatibility_date = "2024-09-23"
# Production cutover: only the custom domain serves traffic. The historical
# `*.workers.dev` URL would otherwise stay up alongside `pairing.viveworker.com`,
# leaving an unintended parallel endpoint that bypasses the custom-domain CDN
# rules. Flip back to `true` for one-off `wrangler dev` smoke tests if needed.
workers_dev = false

# Custom domain — `custom_domain = true` lets Cloudflare auto-manage the
# DNS record (same pattern as share-worker / a2a-worker). Zone already
# exists in this account.
routes = [
  { pattern = "pairing.viveworker.com", zone_name = "viveworker.com", custom_domain = true },
]

# PairingChannel — one Durable Object instance per pairingId. Holds the two
# WebSockets (phone + bridge) and an in-memory replay buffer. Hibernatable:
# CF unloads the DO between messages so we don't pay for idle pairings.
[[durable_objects.bindings]]
name = "PAIRING_CHANNEL"
class_name = "PairingChannel"

[[durable_objects.bindings]]
name = "RELAY_ANALYTICS"
class_name = "RemoteRelayAnalytics"

# Optional secret:
#   STATS_ADMIN_TOKEN
#
# When set via `wrangler secret put STATS_ADMIN_TOKEN`, `/stats/remote`
# exposes private operator counters to requests with
# `Authorization: Bearer <token>`. Without it, only `/stats/remote/public`
# is available.

# SQLite-backed DO is the recommended default for new projects. PairingChannel
# keeps transport state in memory; RemoteRelayAnalytics persists only aggregate
# daily counters.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingChannel"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RemoteRelayAnalytics"]

# Cloudflare-native Rate Limit bindings. These replace the per-isolate
# in-memory token-bucket Map that lived in module scope; that Map gave each
# isolate its own counter, so an attacker hitting a few isolates in parallel
# could trivially bypass it. The CF Rate Limit binding aggregates across
# every isolate in this Worker so the limit is real.
#
# Note: `wrangler dev --local` returns `success: true` unconditionally for
# rate limit bindings (no local enforcement). Verify behaviour against a
# remote / staging deploy before counting on these in production smoke tests.

# INVALID_TOKEN_RL — caps how many bogus relay-token attempts a single client
# IP can burn through per minute. Anything past this is almost certainly a
# bot or PoW-token scanner; legitimate phones never see >1 invalid attempt
# (the token is generated locally and persisted, so it's either correct or
# the pairing is broken — neither case retries 30 times in a minute).
[[ratelimits]]
name = "INVALID_TOKEN_RL"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 30
  period = 60

# WS_UPGRADE_RL — caps how many *valid* WebSocket upgrades a single
# (pairingId, IP) tuple can drive per minute. Defends against an attacker
# who has both pairingId AND a valid relay token (e.g. one stolen from a
# compromised device) trying to keep the bridge in a forced-restart loop.
# 60/min is generous: a healthy phone reconnects on visibility / network
# changes — typically 1-5 per minute under normal load.
[[ratelimits]]
name = "WS_UPGRADE_RL"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 60
  period = 60
